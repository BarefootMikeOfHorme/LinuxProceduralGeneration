[package]
name = "vaultmind-forge-core"
version = "0.1.0"
edition = "2021"
authors = ["Michael Shortland <barefoot.mike.of.horme@gmail.com>"]
description = "High-performance geometry and procedural generation engine for VaultMind Forge"
license = "Proprietary"

[lib]
name = "vaultmind_forge_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Linear Algebra & Math
nalgebra = { version = "0.33", features = ["serde-serialize"] }
nalgebra-glm = "0.18"

# Geometry & Collision (CSG Operations)
parry3d = "0.17"

# Mesh Operations

# Triangulation
earcut = "0.4"

# 2D Geometry Tessellation
lyon = "1.0"

# Parallel Processing
rayon = "1.10"

# Python Bindings (optional for pure Rust usage)
pyo3 = { version = "0.22", features = ["extension-module"], optional = true }
numpy = { version = "0.22", optional = true }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Error Handling
thiserror = "1.0"
anyhow = "1.0"

# Random Number Generation
rand = "0.8"
noise = "0.9"

# Utilities
itertools = "0.13"

[dev-dependencies]
criterion = "0.5"
approx = "0.5"


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[features]
default = ["python-bindings"]
python-bindings = ["pyo3", "numpy"]
visualization = []
