[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vaultmind-forge"
version = "0.1.0"
description = "Unified AI rendering, refinement & control framework"
readme = "README.md"
authors = [{ name = "Michael Shortland", email = "barefoot.mike.of.horme@github.com" }]
license = { text = "Proprietary - Michael Sovereign License v1.0" }
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.8",
  "jsonschema>=4.23",
  "jinja2>=3.1",
  "numpy>=1.26",
  "pillow>=10.4",
  "scipy>=1.11",
  "tqdm>=4.66",
  # Procedural generation & lineage visualization
  "matplotlib>=3.8",
  "networkx>=3.2",
  # Default Python B-rep CAD-as-code runtime (OpenCascade/OCP stack)
  "build123d>=0.11.0,<1",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.123.0",
  "uvicorn[standard]>=0.38.0",
  "slowapi>=0.1.9",
  "python-dotenv>=1.2.0",
  "pyyaml>=6.0",
  "aiofiles>=25.1.0",
  "psutil>=7.1.0",
]

ai = [
  "torch>=2.5.0",
  "torchvision>=0.20.0",
  "torchaudio>=2.5.0",
  "transformers>=4.57.0",
  "diffusers>=0.35.0",
  "accelerate>=1.11.0",
  "safetensors>=0.6.0",
  "tokenizers>=0.22.0",
  "huggingface-hub>=0.36.0",
]

native-build = [
  "maturin>=1.10.0",
]

dev = [
  "pytest>=7.4",
  "pytest-asyncio>=1.3.0",
  "pytest-cov>=4.1",
  "black>=23.12",
  "mypy>=1.8",
  "maturin>=1.10.0",
]

procedural = [
  # Optional pure-Python procedural tools
  "opensimplex>=0.4",
  "perlin-noise>=1.13",
]

[project.scripts]
forge = "vaultmind_forge.forge_cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["vaultmind_forge*", "backend*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["vaultmind_forge/tests"]
# `contract` covers the LPG-L1 schema and authority contracts, which are fast
# and must always run. `slow` marks modules that take minutes; deselect them
# with `-m "not slow"` when iterating. `network` marks tests that make live
# HTTP calls and are skipped by default.
addopts = "-m 'not network'"
markers = [
  "contract: LPG-L1 schema and authority contract tests",
  "slow: tests that take minutes to run",
  "network: tests that make live network calls",
]
