[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vaultmind-forge"
version = "0.1.0"
description = "Unified AI rendering, refinement & control framework"
readme = "README.md"
authors = [{ name = "Vaultmind" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.8",
  "jsonschema>=4.23",
  "jinja2>=3.1",
  "numpy>=1.26",
  "pillow>=10.4",
  "scipy>=1.11",
  "tqdm>=4.66",
  # Procedural generation & lineage visualization
  "matplotlib>=3.8",
  "networkx>=3.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "black>=23.12",
  "mypy>=1.8",
]

procedural = [
  # Optional pure-Python procedural tools
  "opensimplex>=0.4",
  "perlin-noise>=1.13",
]

[project.scripts]
forge = "vaultmind_forge.forge_cli:app"

[tool.setuptools.packages.find]
where = ["vaultmind_forge"]
include = ["*"]