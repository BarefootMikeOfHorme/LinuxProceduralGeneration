[package]
name = "vmf-validator"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
name = "vmf_validator"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
image = "0.25"
ndarray = "0.16"
rayon = "1.8"

# Procedural generation
noise = "0.9"
rand = "0.8"
rand_chacha = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Pattern matching
regex = "1.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
