[package]
name = "al1scan"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "al1scan"
path = "src/main.rs"

[dependencies]
crossterm = "=0.27.0"
ratatui = "=0.26.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = { version = "3", default-features = false }

[profile.release]
opt-level = 3
